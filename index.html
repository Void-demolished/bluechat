<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>External Notifications</title>
</head>
<body>
    <input type="text" id="userInput" placeholder="Type something..." style="width: 200px; padding: 8px;">
    <button id="notifyBtn">Send Notification</button>

    <script>
        const inputField = document.getElementById('userInput');
        const button = document.getElementById('notifyBtn');

        function requestPermissionAndNotify(message) {
            if (!message.trim()) {
                message = '(empty message)';
            }

            if (Notification.permission === 'granted') {
                new Notification('You typed:', { body: message });
            } 
            else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        new Notification('You typed:', { body: message });
                    } else {
                        alert('Notification blocked. You wrote: ' + message);
                    }
                });
            } else {
                alert('Notifications are blocked by browser. You wrote: ' + message);
            }
        }

        button.addEventListener('click', function() {
            const typedMessage = inputField.value;
            requestPermissionAndNotify(typedMessage);
        });
    </script>
</body>
</html>
