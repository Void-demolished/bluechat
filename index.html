<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>First Person Gray Baseplate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }
        #cursor-status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 18px;
            z-index: 10;
            font-family: monospace;
            border: 2px solid #0f0;
            font-weight: bold;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 12px;
            z-index: 10;
        }
        canvas {
            cursor: none;
        }
    </style>
</head>
<body>
    <div id="cursor-status">
        🖱️ CURSOR X: <span id="cursor-x">---</span> | Y: <span id="cursor-y">---</span>
    </div>
    <div id="controls">🎮 MOVE MOUSE TO TURN | WASD / ARROWS to move | ESC to unlock</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.FogExp2(0x111111, 0.008);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const baseplateGeometry = new THREE.PlaneGeometry(30, 30);
        const baseplateMaterial = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide });
        const baseplate = new THREE.Mesh(baseplateGeometry, baseplateMaterial);
        baseplate.rotation.x = -Math.PI / 2;
        baseplate.position.y = -0.05;
        baseplate.receiveShadow = true;
        scene.add(baseplate);

        const gridHelper = new THREE.GridHelper(30, 20, 0xc0c0c0, 0x808080);
        gridHelper.position.y = -0.04;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.5;
        scene.add(gridHelper);

        const ambientLight = new THREE.AmbientLight(0x8a8a8a, 0.85);
        scene.add(ambientLight);
        
        const fillLight = new THREE.PointLight(0xccaa88, 0.7);
        fillLight.position.set(-3, 5, 3);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0x88aacc, 0.5);
        backLight.position.set(0, 4, -6);
        scene.add(backLight);
        
        const rimLight = new THREE.PointLight(0xddbb99, 0.6);
        rimLight.position.set(3, 3, -4);
        scene.add(rimLight);
        
        const topFill = new THREE.PointLight(0xccaa99, 0.55);
        topFill.position.set(0, 6, 0);
        scene.add(topFill);

        let yaw = 0;
        let pitch = 0;
        let isLocked = false;
        let centerX = Math.floor(window.innerWidth / 2);
        let centerY = Math.floor(window.innerHeight / 2);
        
        const cursorXSpan = document.getElementById('cursor-x');
        const cursorYSpan = document.getElementById('cursor-y');
        
        function updateCenterCoordinates() {
            centerX = Math.floor(window.innerWidth / 2);
            centerY = Math.floor(window.innerHeight / 2);
            if (isLocked) {
                cursorXSpan.textContent = centerX;
                cursorYSpan.textContent = centerY;
            }
        }
        
        window.addEventListener('resize', () => {
            updateCenterCoordinates();
        });
        
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        
        document.addEventListener('pointerlockchange', lockChange);
        document.addEventListener('mozpointerlockchange', lockChange);
        
        function lockChange() {
            if (document.pointerLockElement === renderer.domElement) {
                isLocked = true;
                document.addEventListener('mousemove', onMouseMove);
                renderer.domElement.style.cursor = 'none';
                updateCenterCoordinates();
            } else {
                isLocked = false;
                document.removeEventListener('mousemove', onMouseMove);
                renderer.domElement.style.cursor = 'default';
                cursorXSpan.textContent = '---';
                cursorYSpan.textContent = '---';
            }
        }
        
        function onMouseMove(event) {
            if (!isLocked) return;
            
            const sensitivity = 0.0035;
            yaw -= event.movementX * sensitivity;
            pitch -= event.movementY * sensitivity;
            
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
            
            cursorXSpan.textContent = centerX;
            cursorYSpan.textContent = centerY;
        }
        
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            KeyW: false, KeyS: false, KeyA: false, KeyD: false
        };
        
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
                e.preventDefault();
            }
        });
        
        const moveSpeed = 7.0;
        
        function updateMovement(deltaTime) {
            const moveForward = keys.ArrowUp || keys.KeyW;
            const moveBack = keys.ArrowDown || keys.KeyS;
            const moveLeft = keys.ArrowLeft || keys.KeyA;
            const moveRight = keys.ArrowRight || keys.KeyD;
            
            const actualSpeed = moveSpeed * deltaTime;
            
            const forward = new THREE.Vector3();
            const right = new THREE.Vector3();
            
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            
            right.crossVectors(new THREE.Vector3(0, 1, 0), forward);
            right.normalize();
            
            let moveDelta = new THREE.Vector3(0, 0, 0);
            if (moveForward) moveDelta.z -= actualSpeed;
            if (moveBack) moveDelta.z += actualSpeed;
            if (moveLeft) moveDelta.x -= actualSpeed;
            if (moveRight) moveDelta.x += actualSpeed;
            
            moveDelta.applyQuaternion(camera.quaternion);
            moveDelta.y = 0;
            
            camera.position.x += moveDelta.x;
            camera.position.z += moveDelta.z;
            
            const limit = 13.5;
            camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
            camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));
        }
        
        let lastTime = performance.now();
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            updateMovement(delta);
            
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCenterCoordinates();
        }
        
        animate();
    </script>
</body>
</html>
